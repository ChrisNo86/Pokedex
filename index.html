<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="controls">

  <input 
    type="text" 
    placeholder="Search Pokémon..."
    oninput="onSearchInput(this)"
  >

  <div class="type-filter">
    <button onclick="onTypeChange('all')">All</button>
    <button onclick="onTypeChange('fire')">Fire</button>
    <button onclick="onTypeChange('water')">Water</button>
    <button onclick="onTypeChange('grass')">Grass</button>
    <button onclick="onTypeChange('electric')">Electric</button>
    <button onclick="onTypeChange('ghost')">Ghost</button>
  </div>

</div>
  <div id="app">
    <div id="list" class="grid"></div>

    <div class="controls">

 <button id="load-more" onclick="loadMore()">
  <span class="btn-text">Mehr laden</span>
  <span class="btn-loader"></span>
</button>

    <div id="loader"></div>
  </div>

  <div id="overlay" onclick="closeOverlay()"></div>
  <button onclick="switchTab('stats')" class="tab" data-tab="stats"></button>

  <script type="module" src="main.js"></script>
</body>
</html>
